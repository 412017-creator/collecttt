<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Mart Insight - Cloud Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap');
        
        :root {
            --gold: #d4af37;
            --supermarket-floor: #0f0f11;
            --shelf-metal: #2a2a2a;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--supermarket-floor);
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 1%);
            color: #e5e7eb;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass {
            background: rgba(25, 25, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }

        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .shelf-row {
            background: linear-gradient(180deg, transparent 0%, rgba(60, 60, 70, 0.2) 85%, var(--shelf-metal) 98%, #000 100%);
            border-bottom: 3px solid var(--gold);
            margin-bottom: 4rem;
            min-height: 220px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .item-card {
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        .item-card:hover {
            transform: translateY(-15px) scale(1.05);
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }

        .emoji-shine {
            position: relative;
            display: inline-block;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-shine img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .emoji-shine::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -100%;
            width: 50%;
            height: 200%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: rotate(30deg);
            animation: shine-loop 4s infinite;
            pointer-events: none;
        }

        @keyframes shine-loop {
            0% { left: -100%; }
            20% { left: 150%; }
            100% { left: 150%; }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .btn-gold {
            background: linear-gradient(135deg, #bf953f, #b38728);
            color: white;
            padding: 8px 20px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-gold:hover {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="p-4 md:p-6">

    <div id="loading" class="loading-overlay">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-4xl text-amber-500 mb-4"></i>
            <p class="gold-text tracking-widest uppercase text-sm">數據同步中...</p>
        </div>
    </div>

    <div class="max-w-6xl mx-auto relative z-10">
        <header class="mb-6 flex justify-between items-center border-b border-white/5 pb-4">
            <div>
                <h1 class="text-2xl font-black tracking-[0.2em] gold-text uppercase">Mart Cloud</h1>
                <p class="text-[9px] text-gray-500 tracking-[0.4em] uppercase">精品雲端數據管理</p>
            </div>
            <div id="authSection" class="flex items-center gap-4">
                <!-- 登入按鈕或使用者資訊將動態注入 -->
                <button id="btnLogin" class="btn-gold"><i class="fab fa-google mr-2"></i> Google 登入</button>
            </div>
        </header>

        <!-- 數據分析面板 -->
        <div id="intelligencePanel" class="mb-8 grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div class="glass p-4 lg:col-span-3 flex flex-col items-center justify-center">
                <p class="text-[9px] font-bold text-gray-500 mb-4 uppercase tracking-widest self-start">品味分佈</p>
                <div class="w-full max-w-[150px]">
                    <canvas id="marketChart"></canvas>
                </div>
            </div>
            <div class="glass p-5 lg:col-span-9 flex flex-col justify-between border-l-2 border-amber-500/20">
                <div id="aiAnalysisBox">
                    <p class="text-xs text-gray-500 italic">請登入以查看專屬分析報告...</p>
                </div>
                <div class="mt-4 pt-4 border-t border-white/5 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <p class="text-[8px] text-gray-600 uppercase tracking-widest whitespace-nowrap">補貨推薦</p>
                        <div id="recommendationRow" class="flex gap-3 overflow-x-auto no-scrollbar"></div>
                    </div>
                    <!-- 圖片上傳 -->
                    <div class="relative">
                        <input type="file" id="imageUpload" accept="image/*" class="hidden">
                        <button onclick="document.getElementById('imageUpload').click()" class="text-[10px] text-gray-400 hover:text-white transition">
                            <i class="fas fa-camera mr-1"></i> 上傳專屬商品圖
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 物品挑選區 -->
        <div class="glass p-6 mb-12 border-b-2 border-amber-600/50">
            <h2 class="text-[10px] font-bold tracking-[0.3em] text-amber-500 uppercase mb-4">
                <i class="fas fa-shopping-basket mr-2"></i> 精選商品採購
            </h2>
            <div id="itemGallery" class="flex gap-6 overflow-x-auto pb-2 no-scrollbar"></div>
        </div>

        <!-- 展示櫃 -->
        <main class="space-y-16 pb-24">
            <section id="sec-fresh">
                <p class="text-[10px] uppercase tracking-[0.5em] text-green-500/80 font-bold mb-2">A / 冷鏈生鮮</p>
                <div id="grid-fresh" class="shelf-row grid grid-cols-2 md:grid-cols-5 gap-8 px-8 py-10"></div>
            </section>
            <section id="sec-snacks">
                <p class="text-[10px] uppercase tracking-[0.5em] text-blue-400/80 font-bold mb-2">B / 飲品零食</p>
                <div id="grid-snacks" class="shelf-row grid grid-cols-2 md:grid-cols-5 gap-8 px-8 py-10"></div>
            </section>
            <section id="sec-life">
                <p class="text-[10px] uppercase tracking-[0.5em] text-purple-400/80 font-bold mb-2">C / 生活百貨</p>
                <div id="grid-life" class="shelf-row grid grid-cols-2 md:grid-cols-5 gap-8 px-8 py-10"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyBLSmsGZJyHC0R5u-53xq6zkSVa4i9PNVE",
            authDomain: "collecttt-5e745.firebaseapp.com",
            projectId: "collecttt-5e745",
            storageBucket: "collecttt-5e745.firebasestorage.app",
            messagingSenderId: "267535487222",
            appId: "1:267535487222:web:00b8ecc771fe4ff2441cd7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = "premium-mart-v6";

        let currentUser = null;
        let collectionData = [];
        let marketChart = null;

        // 初始化畫廊商品
        const library = [
            { name: '日本和牛', emoji: '🥩', cat: 'fresh', price: 1250, rarity: 85, popularity: 92 },
            { name: '北海道鮮乳', emoji: '🥛', cat: 'fresh', price: 98, rarity: 10, popularity: 98 },
            { name: '空運鮭魚', emoji: '🐟', cat: 'fresh', price: 480, rarity: 40, popularity: 75 },
            { name: '庫克香檳', emoji: '🍾', cat: 'snacks', price: 2800, rarity: 95, popularity: 40 },
            { name: '莊園咖啡', emoji: '☕', cat: 'snacks', price: 150, rarity: 15, popularity: 88 }
        ];

        // 登入功能
        document.getElementById('btnLogin').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed", error);
            }
        };

        // 監聽登入狀態
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('authSection').innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${user.photoURL}" class="w-8 h-8 rounded-full border border-amber-500/50">
                        <div class="text-right hidden sm:block">
                            <p class="text-[10px] font-bold text-white">${user.displayName}</p>
                            <button id="btnLogout" class="text-[8px] text-gray-500 hover:text-red-400">登出</button>
                        </div>
                    </div>
                `;
                document.getElementById('btnLogout').onclick = () => signOut(auth);
                syncFromCloud();
            } else {
                // 如果未登入，也可以選擇匿名登入或顯示空白
                document.getElementById('aiAnalysisBox').innerHTML = `<p class="text-xs text-gray-500 italic">請登入以開啟雲端同步功能...</p>`;
                renderCollection([]); // 清空顯示
            }
        });

        // 從雲端同步資料 (遵循指定路徑)
        function syncFromCloud() {
            if (!currentUser) return;
            document.getElementById('loading').style.display = 'flex';
            
            // 路徑: /artifacts/{appId}/users/{userId}/data
            const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid);
            
            onSnapshot(userDocRef, (docSnap) => {
                document.getElementById('loading').style.display = 'none';
                if (docSnap.exists()) {
                    collectionData = docSnap.data().items || [];
                } else {
                    collectionData = [];
                }
                renderCollection();
                updateIntelligence();
            }, (error) => {
                console.error("Cloud sync error", error);
                document.getElementById('loading').style.display = 'none';
            });
        }

        // 儲存至雲端
        async function saveToCloud() {
            if (!currentUser) return;
            const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid);
            await setDoc(userDocRef, { items: collectionData }, { merge: true });
        }

        // 處理圖片上傳並轉換為 Base64
        document.getElementById('imageUpload').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const base64String = event.target.result;
                    // 將最後一個新增的商品圖示換成此圖片 (範例邏輯)
                    if (collectionData.length > 0) {
                        collectionData[collectionData.length - 1].customImg = base64String;
                        await saveToCloud();
                    }
                };
                reader.readAsDataURL(file);
            }
        };

        // 核心渲染邏輯 (與前版相似，但整合了資料庫)
        function renderGallery() {
            const container = document.getElementById('itemGallery');
            library.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex-shrink-0 w-32 glass p-4 text-center cursor-pointer hover:border-amber-400 transition-all group';
                div.onclick = () => addToCollection(item);
                div.innerHTML = `
                    <div class="emoji-shine text-3xl mb-3">${item.emoji}</div>
                    <div class="text-[10px] font-bold text-gray-400 mb-3">${item.name}</div>
                    <span class="bg-amber-500/10 text-amber-500 text-[10px] px-2 py-1 rounded">$${item.price}</span>
                `;
                container.appendChild(div);
            });
        }

        async function addToCollection(proto) {
            if (!currentUser) return alert("請先登入以儲存您的貨架！");
            const existing = collectionData.find(i => i.name === proto.name);
            if (existing) {
                existing.count++;
            } else {
                collectionData.push({ ...proto, id: Date.now(), count: 1 });
            }
            await saveToCloud();
        }

        window.updateCount = async (id, delta) => {
            const item = collectionData.find(i => i.id === id);
            if (item) {
                item.count += delta;
                if (item.count <= 0) collectionData = collectionData.filter(i => i.id !== id);
                await saveToCloud();
            }
        };

        function renderCollection() {
            const grids = { fresh: 'grid-fresh', snacks: 'grid-snacks', life: 'grid-life' };
            Object.values(grids).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = '';
            });

            collectionData.forEach(item => {
                const gridId = grids[item.cat] || 'grid-life';
                const card = document.createElement('div');
                card.className = 'item-card flex flex-col items-center justify-end h-full';
                const iconContent = item.customImg ? `<img src="${item.customImg}">` : item.emoji;
                
                card.innerHTML = `
                    <div class="emoji-shine text-6xl mb-6">${iconContent}</div>
                    <div class="text-[11px] text-amber-500 font-bold mb-4 bg-black/50 px-3 py-1 rounded">${item.name}</div>
                    <div class="flex items-center gap-4 bg-white/5 rounded-full px-3 py-1 border border-white/10 mb-2">
                        <button onclick="updateCount(${item.id}, -1)" class="text-[9px] text-white/30 hover:text-red-400"><i class="fas fa-minus"></i></button>
                        <span class="text-sm font-black gold-text">${item.count}</span>
                        <button onclick="updateCount(${item.id}, 1)" class="text-[9px] text-white/30 hover:text-green-400"><i class="fas fa-plus"></i></button>
                    </div>
                `;
                document.getElementById(gridId).appendChild(card);
            });
        }

        function updateIntelligence() {
            if (collectionData.length === 0) return;
            const myStats = { fresh: 0, snacks: 0, life: 0 };
            let total = 0;
            collectionData.forEach(i => {
                myStats[i.cat] = (myStats[i.cat] || 0) + i.count;
                total += i.count;
            });

            const ctx = document.getElementById('marketChart').getContext('2d');
            if (marketChart) marketChart.destroy();
            marketChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['生鮮', '飲品', '家居'],
                    datasets: [{
                        label: '您',
                        data: [(myStats.fresh/total)*100, (myStats.snacks/total)*100, (myStats.life/total)*100],
                        backgroundColor: 'rgba(212, 175, 55, 0.2)',
                        borderColor: 'rgba(212, 175, 55, 1)',
                        borderWidth: 2
                    }]
                },
                options: { 
                    scales: { r: { grid: { color: 'rgba(255,255,255,0.05)' }, angleLines: { color: 'rgba(255,255,255,0.05)' }, ticks: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });

            document.getElementById('aiAnalysisBox').innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="bg-amber-500/10 p-3 rounded-lg border-l-2 border-amber-500 flex-1">
                        <p class="text-[13px] text-gray-200">
                            <span class="text-amber-500 font-bold">雲端同步成功：</span> 您的品味數據已安全儲存。當前收藏品項：${collectionData.length} 件。
                        </p>
                    </div>
                </div>
            `;
        }

        renderGallery();
    </script>
</body>
</html>
